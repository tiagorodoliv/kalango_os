# nginx do VPS (aaPanel): kalangos.easysmartcontroll.com serve o repositório
# apt do Kalango OS (arquivos estáticos já assinados; nada roda no servidor).
#
# Como está no VPS (2026-11-15): /www/server/panel/vhost/nginx/kalangos.easysmartcontroll.com.conf,
# arquivos em /www/wwwroot/kalangos.easysmartcontroll.com/apt, certificado do
# certbot (webroot, renovado pelo certbot.timer), como os outros subdomínios.
# Testar e recarregar: /www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
# Kalango OS: repositório apt (estático, já assinado; publicado por
# distro/repo/publicar.sh no repositório do projeto).
server {
    listen 80;
    server_name kalangos.easysmartcontroll.com;
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/kalangos.easysmartcontroll.com;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kalangos.easysmartcontroll.com;
    root /www/wwwroot/kalangos.easysmartcontroll.com;

    ssl_certificate     /etc/letsencrypt/live/kalangos.easysmartcontroll.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalangos.easysmartcontroll.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_kalangos:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Repositório apt: listagem ligada para conferir pelo navegador.
    location /apt/ {
        autoindex on;
    }
    # Índices mudam a cada publicação: sem cache longo.
    location ~ ^/apt/dists/ {
        add_header Cache-Control "no-cache";
    }
    location = / {
        return 302 https://github.com/tiagorodoliv/kalango_os;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /www/wwwlogs/kalangos.easysmartcontroll.com.log;
    error_log  /www/wwwlogs/kalangos.easysmartcontroll.com.error.log;
}
