# nginx do VPS: kalangos.easysmartcontroll.com serve o repositório apt do
# Kalango OS (arquivos estáticos já assinados; nada roda no servidor).
#
# Instalar: copiar para /etc/nginx/sites-available/kalangos, ligar com
#   ln -s ../sites-available/kalangos /etc/nginx/sites-enabled/
#   mkdir -p /var/www/kalangos/apt && nginx -t && systemctl reload nginx
# e pôr HTTPS com o certbot:  certbot --nginx -d kalangos.easysmartcontroll.com
server {
    listen 80;
    listen [::]:80;
    server_name kalangos.easysmartcontroll.com;

    root /var/www/kalangos;

    # Repositório apt: listagem ligada para conferir pelo navegador.
    location /apt/ {
        autoindex on;
    }
    # Índices mudam a cada publicação: sem cache longo.
    location ~ ^/apt/dists/ {
        add_header Cache-Control "no-cache";
    }

    location = / {
        return 302 https://github.com/tiagorodoliv/kalango_os;
    }
}
