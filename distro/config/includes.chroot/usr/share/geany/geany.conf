# Padrões do editor de código do KalangOS (Geany). O Geany usa este arquivo
# só enquanto o usuário não tem o próprio (~/.config/geany/geany.conf, criado
# quando ele muda alguma preferência).
#
# Visual do sistema com as cores de sintaxe do VS Code Dark Modern
# (colorschemes/kalango-dark-modern.conf), números de linha, guias de
# indentação, régua na coluna 100 e fonte JetBrains Mono. Sem a barra de
# ferramentas de ícones coloridos (como no VS Code, tudo fica nos menus).
[geany]
color_scheme=kalango-dark-modern.conf
editor_font=JetBrains Mono 11
tagbar_font=Inter 10
msgwin_font=JetBrains Mono 10
show_linenumber_margin=true
show_markers_margin=true
show_indent_guide=true
show_white_space=false
use_folding=true
long_line_enabled=true
long_line_type=0
long_line_column=100
long_line_color=#1e2a33
scroll_stop_at_last_line=true
pref_editor_tab_width=4
auto_complete_symbols=true
show_editor_scrollbars=true
highlighting_invert_all=false
sidebar_symbol_visible=true
sidebar_openfiles_visible=true
sidebar_page=1
msgwindow_visible=false
tab_pos_editor=2
pref_main_load_session=true
pref_main_confirm_exit=false
beep_on_errors=false
pref_toolbar_show=false

[VTE]
font=JetBrains Mono 10
colour_fore=#e6edf3
colour_back=#07090d
