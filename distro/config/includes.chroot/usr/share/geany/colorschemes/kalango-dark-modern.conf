# Esquema de cores do editor de código do Kalango OS (Geany). Fundo, seleção,
# linha atual e números de linha do tema do sistema (ui/theme.slint); cores de
# sintaxe do tema Dark Modern do VS Code: palavras-chave azuis, controle de
# fluxo rosa, strings laranja, comentários verdes, funções amarelas e tipos
# verde-água. Mesma paleta do Mousepad (gtksourceview-4/styles/kalango.xml).
#
# Formato de cada estilo: frente;fundo;negrito;itálico. Um nome no lugar de uma
# cor reaproveita outro estilo (ex.: "comment_line=comment").

[theme_info]
name=Kalango Dark Modern
description=Escuro do Kalango OS com as cores de sintaxe do VS Code Dark Modern.
version=1.0
author=Kalango OS
url=

[named_colors]
fundo=#0a0f14
fundo_linha=#131920
texto=#dce3ea
cinza=#808080
numero_linha=#515a64
selecao=#194b58
azul=#569cd6
azul_claro=#9cdcfe
constante=#4fc1ff
rosa=#c586c0
laranja=#ce9178
verde=#6a9955
verde_claro=#b5cea8
amarelo=#dcdcaa
verde_agua=#4ec9b0
vermelho=#f07178
regex=#d16969
ouro=#ffd700

[named_styles]
default=texto;fundo;false;false
error=vermelho;fundo;false;true

# Editor
#-------------------------------------------------------------------------------
selection=;selecao;false;true
current_line=;fundo_linha;true
brace_good=ouro;#1e2a33;true;false
brace_bad=vermelho;fundo;true;false
margin_line_number=numero_linha;fundo
margin_folding=numero_linha;fundo
fold_symbol_highlight=#c5c5c5
indent_guide=#1e2a33
caret=#3dd6f5;#3dd6f5;false
marker_line=texto;#1a222b
marker_search=texto;#5a4405
marker_mark=texto;#194b58
call_tips=texto;#131920;false;false
white_space=#1e2a33;fundo;true;false

# Comentários
#-------------------------------------------------------------------------------
comment=verde
comment_doc=verde
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword=azul
comment_doc_keyword_error=vermelho;;false;true

# Números, tipos e funções
#-------------------------------------------------------------------------------
number=verde_claro
number_1=number
number_2=number_1
number_3=constante

type=verde_agua
class=verde_agua
function=amarelo
parameter=azul_claro
annotation=amarelo

# Palavras-chave (keyword_2 costuma ser controle de fluxo: if, for, return)
#-------------------------------------------------------------------------------
keyword=azul
keyword_1=keyword
keyword_2=rosa
keyword_3=verde_agua
keyword_4=constante

identifier=azul_claro
identifier_1=default
identifier_2=identifier_1
identifier_3=identifier_1
identifier_4=identifier_1

# Strings
#-------------------------------------------------------------------------------
string=laranja
string_1=string
string_2=string
string_eol=laranja;#3a1f1f;false;false
character=string
backticks=string
here_doc=string

# Outros
#-------------------------------------------------------------------------------
label=rosa
preprocessor=rosa
regex=regex
operator=texto
decorator=amarelo
macro=azul
other=azul_claro

# HTML, XML e outras marcações
#-------------------------------------------------------------------------------
tag=azul
tag_unknown=azul
tag_end=cinza
attribute=azul_claro
attribute_unknown=azul_claro
value=laranja
entity=azul

# Diff
#-------------------------------------------------------------------------------
line_added=#81b88b
line_removed=#c74e39
line_changed=#e2c08d
