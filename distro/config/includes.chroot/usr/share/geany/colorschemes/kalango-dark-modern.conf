# Esquema de cores do editor de código do Kalango OS (Geany), com a paleta do
# tema "Dark Modern" do VS Code: fundo #1f1f1f, números de linha #6e7681,
# palavras-chave azuis, controle de fluxo rosa, strings laranja, comentários
# verdes, funções amarelas e tipos verde-água.
#
# Formato de cada estilo: frente;fundo;negrito;itálico. Um nome no lugar de uma
# cor reaproveita outro estilo (ex.: "comment_line=comment").

[theme_info]
name=Kalango Dark Modern
description=Cores do tema Dark Modern do VS Code, no editor de código do Kalango OS.
version=1.0
author=Kalango OS
url=

[named_colors]
fundo=#1f1f1f
fundo_linha=#2a2a2a
texto=#d4d4d4
cinza=#808080
numero_linha=#6e7681
selecao=#264f78
azul=#569cd6
azul_claro=#9cdcfe
constante=#4fc1ff
rosa=#c586c0
laranja=#ce9178
verde=#6a9955
verde_claro=#b5cea8
amarelo=#dcdcaa
verde_agua=#4ec9b0
vermelho=#f44747
regex=#d16969
ouro=#ffd700

[named_styles]
default=texto;fundo;false;false
error=vermelho;fundo;false;true

# Editor
#-------------------------------------------------------------------------------
selection=;selecao;false;true
current_line=;fundo_linha;true
brace_good=ouro;#3a3a3a;true;false
brace_bad=vermelho;fundo;true;false
margin_line_number=numero_linha;fundo
margin_folding=numero_linha;fundo
fold_symbol_highlight=#c5c5c5
indent_guide=#404040
caret=#aeafad;#aeafad;false
marker_line=texto;#3a3d41
marker_search=texto;#9e6a03
marker_mark=texto;#264f78
call_tips=texto;#252526;false;false
white_space=#3b3b3b;fundo;true;false

# Comentários
#-------------------------------------------------------------------------------
comment=verde
comment_doc=verde
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword=azul
comment_doc_keyword_error=vermelho;;false;true

# Números, tipos e funções
#-------------------------------------------------------------------------------
number=verde_claro
number_1=number
number_2=number_1
number_3=constante

type=verde_agua
class=verde_agua
function=amarelo
parameter=azul_claro
annotation=amarelo

# Palavras-chave (keyword_2 costuma ser controle de fluxo: if, for, return)
#-------------------------------------------------------------------------------
keyword=azul
keyword_1=keyword
keyword_2=rosa
keyword_3=verde_agua
keyword_4=constante

identifier=azul_claro
identifier_1=default
identifier_2=identifier_1
identifier_3=identifier_1
identifier_4=identifier_1

# Strings
#-------------------------------------------------------------------------------
string=laranja
string_1=string
string_2=string
string_eol=laranja;#3a1f1f;false;false
character=string
backticks=string
here_doc=string

# Outros
#-------------------------------------------------------------------------------
label=rosa
preprocessor=rosa
regex=regex
operator=texto
decorator=amarelo
macro=azul
other=azul_claro

# HTML, XML e outras marcações
#-------------------------------------------------------------------------------
tag=azul
tag_unknown=azul
tag_end=cinza
attribute=azul_claro
attribute_unknown=azul_claro
value=laranja
entity=azul

# Diff
#-------------------------------------------------------------------------------
line_added=#81b88b
line_removed=#c74e39
line_changed=#e2c08d
