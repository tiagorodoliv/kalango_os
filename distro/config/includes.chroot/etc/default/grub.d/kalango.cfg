# Nome do sistema no menu do GRUB (o padrão viria do lsb_release: "Debian").
GRUB_DISTRIBUTOR="Kalango OS"

# Tema gráfico (distro/grub/gerar-tema.py). O 10_linux põe "--class kalango"
# (primeira palavra do GRUB_DISTRIBUTOR) e o tema mostra o ícone do sistema.
GRUB_THEME="/boot/grub/themes/kalango/theme.txt"
GRUB_GFXMODE=auto
