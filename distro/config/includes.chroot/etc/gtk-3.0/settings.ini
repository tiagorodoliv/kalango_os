# Apps GTK 3 (Thunar, Mousepad, Ristretto, Firefox) no tema do KalangOS
# (/usr/share/themes/Kalango, mesmas cores do shell).
[Settings]
gtk-theme-name=Kalango
gtk-icon-theme-name=Kalango-Ciano
gtk-application-prefer-dark-theme=1
gtk-font-name=Inter 10
# Minimizar, maximizar e fechar à direita (o padrão do GNOME só tem o fechar).
gtk-decoration-layout=menu:minimize,maximize,close
