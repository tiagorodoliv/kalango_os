# Tela de bloqueio do Kalango OS (gtklock), aberta pelo kalango-bloquear.
# Formato "key file" do GLib: comentários só com #.
[main]
gtk-theme=Kalango
style=/etc/kalango/bloqueio/style.css

# Barra do módulo powerbar (compilado na ISO por distro/gtklock/powerbar.sh):
# só o botão "Trocar de usuário", que abre a tela de login extra sem fechar
# esta sessão. Comando vazio esconde o botão (reiniciar, desligar, suspender).
[powerbar]
show-labels=true
userswitch-command=kalango-trocar-usuario
reboot-command=
poweroff-command=
suspend-command=
