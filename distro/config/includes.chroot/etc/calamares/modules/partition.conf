# KalangOS — particionamento do instalador (Calamares 3.3).
#
# O Debian não traz este arquivo (nem o pacote calamares): sem ele valiam os
# padrões internos do Calamares, que reservam uma swap do tamanho da RAM para
# poder hibernar (32 GB numa máquina com 32 GB de memória).
#
# Padrão: sem partição swap (decidido em 2026-11-17, como pediu o Tiago). O
# KalangOS já usa zram (swap comprimida na própria RAM), e quem quiser swap no
# disco escolhe o tamanho depois em Configurações → Energia (arquivo de swap,
# como no Ubuntu, sem partição). Aqui ficam as opções do Calamares para quem
# já sabe o que quer: "pequena" (até 4 GB) ou "hibernar" (do tamanho da RAM).
# O shellprocess@kalango tira o resume= do GRUB quando a swap não serve para
# hibernar (/usr/local/lib/kalango/sem-hibernar.sh).
#
# Só a swap muda: as outras chaves continuam nos padrões do Calamares, como
# antes (partição EFI em /boot/efi, ext4...).
---
userSwapChoices:
    - none      # Sem swap no disco (só a zram; padrão)
    - small     # Pequena: até 4 GB
    - suspend   # Do tamanho da RAM, para hibernar
initialSwapChoice: none
