# Ajustes do Kalango OS no sistema instalado (roda dentro dele, como root).
---
dontChroot: false
timeout: 60
script:
    # Sem login automático: o usuário "user" é só da ISO live. No sistema
    # instalado a sessão começa pela tela de login do Kalango (greeter).
    # "Q" corta o arquivo a partir de [initial_session]; não usar "$" aqui,
    # o Calamares trata "$nome" como variável.
    - "sed -i '/^\\[initial_session\\]/Q' /etc/greetd/config.toml"
    # O instalador e o atalho dele não servem mais depois de instalado.
    - "rm -f /usr/local/bin/kalango-instalar"
