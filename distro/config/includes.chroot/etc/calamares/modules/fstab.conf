# Kalango OS: o fstab.conf do calamares-settings-debian + /tmp no disco.
# Sem tmpOptions o Calamares põe o /tmp na memória (tmpfs, metade da RAM):
# instaladores grandes (ESP-IDF, Android SDK) enchem e falham com "No space
# left on device". Como no Ubuntu, o /tmp fica no disco (o tmp.mount do
# systemd também está mascarado em /etc/systemd/system).
---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime
ssdExtraMountOptions:
    ext4: discard
    jfs: discard
    xfs: discard
    swap: discard
    btrfs: discard,compress=lzo
crypttabOptions: luks,discard,keyscript=/bin/cat

tmpOptions:
    default:
        tmpfs: false
    ssd:
        tmpfs: false
