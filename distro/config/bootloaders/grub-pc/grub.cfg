# Menu da ISO do Kalango OS. O live-build troca os @...@ pelo kernel, initrd e
# opções de boot. As entradas têm --class para o tema mostrar o ícone certo.
source /boot/grub/config.cfg

menuentry "Kalango OS" --class kalango --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

# Vídeo genérico: para placas que travam ou deixam a tela preta no boot.
menuentry "Kalango OS (safe graphics)" --class kalango --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

submenu "Utilities..." --class efi --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --class efi --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --class efi --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
