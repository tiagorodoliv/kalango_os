[package]
name = "kalango_os"
version = "0.1.1"
edition = "2021"
description = "Interface gráfica (shell) do KalangOS, distro Linux baseada no Debian, em Rust + Slint"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Slint: toolkit de UI declarativo, pensado para embarcado.
# Em desenvolvimento (Mac/Linux desktop) usa o backend padrão (winit, janela comum).
slint = { version = "1.8", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    # Eventos crus do winit: o Alt+Tab precisa saber quando o Alt é solto
    # (src/shell/switcher.rs).
    "unstable-winit-030",
] }

# Papel de parede com imagem própria: reduzir e gravar (src/shell/wallpaper.rs).
# A mesma versão e os mesmos formatos que o Slint já usa: não entra código novo.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Estilos Mandacaru dos ícones (src/launcher/icon_style.rs): desenhar o SVG do
# ícone em pixels para tingi-lo. A mesma versão que o Slint já usa para os SVG.
resvg = { version = "0.48", default-features = false }

# Data/hora local (fuso do sistema) para o relógio da barra e do login.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Áreas de trabalho da barra (protocolo ext-workspace do labwc, src/shell/workspaces.rs).
# As mesmas versões que o winit já usa: não entra código novo além do protocolo.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Janelas abertas (wlr-foreign-toplevel): dock e Alt+Tab (src/shell/toplevels.rs).
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
# Só para examples/snapshot.rs (gera PNG das telas para comparar com o layout).
png = "0.18"

[build-dependencies]
# Compila os arquivos .slint em código Rust durante o build.
slint-build = "1.8"

[features]
default = []
# Build para o dispositivo: desenha direto via DRM/KMS + libinput, sem X11/Wayland.
# Uso: cargo build --release --features kms
kms = ["slint/backend-linuxkms-noseat"]

# Build rápido para testar na VM (distro/testar-vm.sh): otimizado, mas sem
# LTO e com compilação incremental (segundos em vez de minutos).
[profile.vm]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.release]
# Binário menor e mais rápido para o alvo embarcado.
lto = true
codegen-units = 1
strip = true
