[package]
name = "kalango_os"
version = "0.1.0"
edition = "2021"
description = "Interface gráfica (shell) do Kalango OS, distro Linux baseada no Debian, em Rust + Slint"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Slint: toolkit de UI declarativo, pensado para embarcado.
# Em desenvolvimento (Mac/Linux desktop) usa o backend padrão (winit, janela comum).
slint = { version = "1.8", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
] }

# Data/hora local (fuso do sistema) para o relógio da barra e do login.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
# Só para examples/snapshot.rs (gera PNG das telas para comparar com o layout).
png = "0.18"

[build-dependencies]
# Compila os arquivos .slint em código Rust durante o build.
slint-build = "1.8"

[features]
default = []
# Build para o dispositivo: desenha direto via DRM/KMS + libinput, sem X11/Wayland.
# Uso: cargo build --release --features kms
kms = ["slint/backend-linuxkms-noseat"]

[profile.release]
# Binário menor e mais rápido para o alvo embarcado.
lto = true
codegen-units = 1
strip = true
